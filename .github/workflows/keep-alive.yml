name: Keep Render awake

# Render's free tier sleeps after ~15 min idle, causing slow cold starts (and
# Vercel proxy timeouts). This pings the API health endpoint every 10 minutes
# so the instance — and the in-process background workers — stay running.
#
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity;
# any push re-enables them. You can also trigger this manually from the Actions
# tab via "Run workflow".

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may delay under load)
  workflow_dispatch: {}

# Avoid piling up runs if a ping is slow (e.g. during a cold start).
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          URL="https://fluxionos-api.onrender.com/api/health"
          # Retry a few times: a cold start can take 30-60s to wake.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --max-time 90 -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is awake."
              exit 0
            fi
            sleep 15
          done
          echo "API did not return 200 after retries."
          exit 1
